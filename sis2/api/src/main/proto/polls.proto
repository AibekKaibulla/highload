syntax = "proto3";

// Internal contract between API Gateway and the services.
// The REST/JSON baseline uses the same fields (see com.polls.api.dto), so the
// comparison measures only encoding + transport, not different data.
//
// Schema evolution rules: only add new fields with new numbers,
// never reuse or renumber a field, mark deleted ones as `reserved`.
package polls.v1;

option java_package = "com.polls.api.proto";
option java_multiple_files = true;

service PollService {
  // Not naturally idempotent -> protected by idempotency_key.
  rpc CreatePoll(CreatePollRequest) returns (CreatePollResponse);
  rpc GetPoll(GetPollRequest) returns (Poll);
  // Large payload for the size/latency comparison (up to 1000 polls).
  rpc ListPolls(ListPollsRequest) returns (PollList);
}

service VoteService {
  // Idempotent thanks to PK(poll_id, user_id).
  rpc CastVote(CastVoteRequest) returns (CastVoteResponse);
  rpc GetResults(GetResultsRequest) returns (Results);
}

message Option {
  int64 option_id = 1;
  string text = 2;
}

message Poll {
  int64 poll_id = 1;
  int64 creator_id = 2;
  string question = 3;
  repeated Option options = 4;
  int64 created_at_ms = 5;
}

message CreatePollRequest {
  int64 creator_id = 1;
  string question = 2;
  repeated string options = 3;
  string idempotency_key = 4; // UUID, generated once per logical action by the client
}

message CreatePollResponse {
  Poll poll = 1;
  bool replayed = 2; // true = same key seen before, stored result returned
}

message GetPollRequest {
  int64 poll_id = 1;
}

message ListPollsRequest {
  int64 after_id = 1;
  int32 limit = 2;
}

message PollList {
  repeated Poll polls = 1;
}

message CastVoteRequest {
  int64 poll_id = 1;
  int64 user_id = 2;
  int64 option_id = 3;
}

message CastVoteResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    CREATED = 1;            // new vote stored, counter incremented
    ALREADY_VOTED_SAME = 2; // retry of the same vote, nothing changed
  }
  Status status = 1;
  int64 poll_id = 2;
  int64 option_id = 3;
}

message GetResultsRequest {
  int64 poll_id = 1;
}

message OptionCount {
  int64 option_id = 1;
  int64 count = 2;
}

message Results {
  int64 poll_id = 1;
  int64 total = 2;
  repeated OptionCount results = 3;
}

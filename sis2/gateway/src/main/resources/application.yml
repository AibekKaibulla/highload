server:
  port: 8080

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true     # each public request on a virtual thread; blocking backend calls are cheap
  jackson:
    property-naming-strategy: SNAKE_CASE

# Resilience settings. Can be changed at runtime with PUT /admin/settings (for experiments).
gateway:
  protocol: grpc             # grpc | rest  -> which internal transport to use
  deadline-ms: 100           # total budget per public request = p99 target 
  attempt-timeout-ms: 0      # 0 = each attempt may use the whole remaining budget
  max-attempts: 3            # 1 try + at most 2 retries
  base-backoff-ms: 10        # backoff window: 10, 20, 40 ... ms
  max-backoff-ms: 50         # cap
  jitter: true               # full jitter: sleep random(0, window)
  retry-on-deadline: false   # retry DEADLINE_EXCEEDED attempts (only useful with attempt-timeout-ms > 0)

backends:
  connect-timeout-ms: 500    # TCP connect inside one datacenter takes < 1 ms; 500 ms = clearly down
  poll:
    grpc-target: dns:///localhost:9091
    rest-url: http://localhost:8091
  vote:
    grpc-target: dns:///localhost:9092
    rest-url: http://localhost:8092

auth:
  jwt-secret: dev-secret-change-me-it-must-be-at-least-32-bytes
  test-header-enabled: false # load tests only: accept X-User-Id instead of a JWT
  dev-endpoints: false       # GET /dev/token?user_id=1 issues a test JWT

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
